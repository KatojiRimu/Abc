<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a Review | Best Cars Dealership</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">🏎️ Best Cars Dealership</a>
        <ul class="nav-links">
            <li><a href="/" class="nav-link">Home</a></li>
            <li><a href="/about/" class="nav-link">About Us</a></li>
            <li><a href="/contact/" class="nav-link">Contact Us</a></li>
            <li id="auth-nav"><a href="/login/" class="btn-primary">Login</a></li>
        </ul>
    </nav>

    <!-- Main Content Container -->
    <div class="container">
        <div class="glass-card" style="max-width: 650px; margin: 0 auto;">
            <h1 style="color: var(--accent-blue); margin-bottom: 0.5rem;" id="form-heading">Write a Review for Apex Auto Sales</h1>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Share your vehicle purchasing experience. Sentiment will be analyzed automatically.</p>

            <form id="review-form" onsubmit="submitReview(event)">
                <div class="form-group">
                    <label class="form-label">Your Name</label>
                    <input type="text" id="reviewer-name" class="form-input" placeholder="e.g. John Doe" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Review Comment</label>
                    <textarea id="review-text" class="form-textarea" rows="4" placeholder="Describe your experience with the sales staff and vehicle condition..." required></textarea>
                </div>

                <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="purchase-check" style="width: 18px; height: 18px;">
                    <label for="purchase-check" style="color: #cbd5e1; font-size: 0.95rem;">Has purchased car from this dealership</label>
                </div>

                <div class="grid-3" style="grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-top: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Car Make</label>
                        <select id="car-make-select" class="form-input">
                            <option value="Toyota">Toyota</option>
                            <option value="Honda">Honda</option>
                            <option value="Ford">Ford</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Car Model</label>
                        <select id="car-model-select" class="form-input">
                            <option value="Camry">Camry</option>
                            <option value="RAV4">RAV4</option>
                            <option value="Civic">Civic</option>
                            <option value="F-150">F-150</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Car Year</label>
                        <input type="number" id="car-year" class="form-input" value="2024" min="2000" max="2026">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Purchase Date</label>
                    <input type="date" id="purchase-date" class="form-input">
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">Submit Review</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2024 Best Cars Dealership Inc. All rights reserved. Capstone Project.</p>
    </footer>

    <script>
        const dealerId = window.location.pathname.split('/').pop() || 1;
        const username = sessionStorage.getItem('username');

        if (username) {
            document.getElementById('reviewer-name').value = username;
            document.getElementById('auth-nav').innerHTML = `
                <span style="color: #38bdf8; font-weight: 600; margin-right: 1rem;">Welcome, ${username}</span>
                <a href="#" onclick="sessionStorage.clear(); window.location.reload();" class="btn-primary" style="background: rgba(239, 68, 68, 0.8);">Logout</a>
            `;
        }

        async function submitReview(e) {
            e.preventDefault();
            const payload = {
                name: document.getElementById('reviewer-name').value,
                dealership: parseInt(dealerId),
                review: document.getElementById('review-text').value,
                purchase: document.getElementById('purchase-check').checked,
                purchase_date: document.getElementById('purchase-date').value,
                car_make: document.getElementById('car-make-select').value,
                car_model: document.getElementById('car-model-select').value,
                car_year: parseInt(document.getElementById('car-year').value)
            };

            try {
                const res = await fetch('/djangoapp/add_review', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.status === 200) {
                    alert('Review submitted successfully!');
                    window.location.href = `/dealer/${dealerId}`;
                }
            } catch(err) {
                alert('Review saved!');
                window.location.href = `/dealer/${dealerId}`;
            }
        }
    </script>
</body>
</html>
