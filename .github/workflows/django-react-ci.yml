name: Django + React CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install flake8
      run: pip install flake8
    - name: Run Linter
      run: flake8 server/ --count --select=E9,F63,F7,F82 --show-source --statistics

  lint-js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Install JSHint
      run: npm install -g jshint
    - name: Run Linter
      run: jshint server/frontend/src/ || true
